# Refreshes GitHub star counts for the Opensource section every week.
name: Update stars

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch:
  push:
    branches: [master]
    paths: [data/opensource.yml, scripts/update_stars.py]

permissions:
  contents: write

concurrency:
  group: update-stars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Fetch stars and render README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stars.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/opensource.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update GitHub stars"
            git push
          fi
